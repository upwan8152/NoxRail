name: NoxRail
options:
  bundleIdPrefix: com.noxrail
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  NoxRail:
    type: application
    platform: iOS
    sources:
      - path: NoxRail
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noxrail.app
        INFOPLIST_FILE: NoxRail/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Set your Team ID here or in Xcode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: NoxRail/NoxRail.entitlements

      archive:
        config: Release

  NoxRailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoxRailTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noxrail.tests
        INFOPLIST_FILE: NoxRail/Info.plist # Reusing for simplicity if applicable, or rely on generation
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: NoxRail

schemes:
  NoxRail:
    build:
      targets:
        NoxRail: all
        NoxRailTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: NoxRailTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
